pre-commit:
  parallel: true
  commands:
    golangci:
      glob: "*.go"
      run: |
        if [ -n "{staged_files}" ]; then
          # First check if there are any errors (exit code matters here)
          # if ! golangci-lint run {staged_files}; then
          #   echo "❌ golangci-lint found issues that need fixing"
          #   exit 1
          # fi

          # If we get here, basic check passed, now apply auto-fixes
          golangci-lint run --fix {staged_files}
          git add {staged_files}
        fi
    go-fmt:
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}
    goimports:
      glob: "*.go"
      run: goimports -w {staged_files} && git add {staged_files}

commit-msg:
  commands:
    commitsar:
      run: commitsar
