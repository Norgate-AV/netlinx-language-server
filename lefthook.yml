pre-commit:
  parallel: true
  commands:
    golangci:
      glob: "*.go"
      run: |
        if [ -n "{staged_files}" ]; then
          golangci-lint run --fix {staged_files}
          git add {staged_files}
        fi
    go-fmt:
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}
    goimports:
      glob: "*.go"
      run: goimports -w {staged_files} && git add {staged_files}

commit-msg:
  commands:
    commitsar:
      run: commitsar
